[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backcheck"
version = "1.0.0"
description = "Чекер лаб курса «Backend-разработка»: проверяет поведение API по HTTP, язык бэкенда не важен"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
backcheck = "backcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
